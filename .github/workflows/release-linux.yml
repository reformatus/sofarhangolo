name: Release Linux

on:
  workflow_call:
    inputs:
      release_tag:
        description: Git tag for the release
        required: true
        type: string
      release_ref:
        description: Full ref for checkout (refs/tags/<tag>)
        required: true
        type: string
      build_name:
        description: Version name from pubspec (e.g. 1.2.1)
        required: true
        type: string
      build_number:
        description: Build number from pubspec (e.g. 1020100)
        required: true
        type: string
      release_date:
        description: ISO date for release metadata stamping
        required: true
        type: string
      prerelease:
        description: Whether this is a prerelease ('true' or 'false')
        required: true
        type: string

jobs:
  build-linux:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            desktop-file-utils \
            flatpak \
            flatpak-builder \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config

      - name: Configure Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Stamp AppStream release metadata
        shell: bash
        run: |
          perl -0pi -e 's#<release version="[^"]+" date="[^"]+" */>#<release version="${{ inputs.build_name }}" date="${{ inputs.release_date }}" />#' linux/packaging/org.lyricapp.sofar.metainfo.xml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux app bundle
        run: flutter build linux --release --verbose

      - name: Package Flatpak bundle
        shell: bash
        run: |
          flatpak-builder \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --repo=repo \
            build/flatpak-app \
            packaging/linux/flatpak/org.lyricapp.sofar.yaml
          flatpak build-bundle \
            repo \
            "sofar-hangolo-${{ inputs.build_name }}-linux-x86_64.flatpak" \
            org.lyricapp.sofar

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: sofar-hangolo-${{ inputs.build_name }}-linux-x86_64.flatpak
          if-no-files-found: error
