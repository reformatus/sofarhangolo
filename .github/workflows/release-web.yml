name: Release Web

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      release_date:
        required: true
        type: string
      prerelease:
        description: Whether this is a prerelease ('true' or 'false')
        required: true
        type: string
      deploy_prerelease:
        description: When 'true', deploy web even for prerelease tags
        required: true
        type: string

jobs:
  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare Drift web assets
        run: dart run tool/prepare_web.dart

      - name: Build Flutter web bundle
        run: flutter build web --release --base-href /web/

      - name: Finalize built web bundle
        run: dart run tool/finalize_web_build.dart

      - name: Upload web release bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: build/web
          if-no-files-found: error

  deploy-web:
    name: Deploy web to app.sofarhangolo.hu
    runs-on: ubuntu-latest
    needs: build-web
    if: ${{ inputs.prerelease != 'true' || inputs.deploy_prerelease == 'true' }}
    env:
      TARGET_REPO: reformatus/app.sofarhangolo.hu
      TARGET_BRANCH: main
      TARGET_DIR: docs/web
    steps:
      - id: deploy-key-ready
        name: Check deploy key
        env:
          DEPLOY_KEY: ${{ secrets.APP_SOFARHANGOLO_HU_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download web bundle
        if: ${{ steps.deploy-key-ready.outputs.ready == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: web-release-build
          path: ${{ runner.temp }}/web-build

      - name: Load deploy key
        if: ${{ steps.deploy-key-ready.outputs.ready == 'true' }}
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.APP_SOFARHANGOLO_HU_DEPLOY_KEY }}

      - name: Trust GitHub SSH host key
        if: ${{ steps.deploy-key-ready.outputs.ready == 'true' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone target Pages repository
        if: ${{ steps.deploy-key-ready.outputs.ready == 'true' }}
        run: |
          git clone \
            --branch "$TARGET_BRANCH" \
            "git@github.com:${TARGET_REPO}.git" \
            "${RUNNER_TEMP}/pages-repo"

      - name: Sync web bundle into Pages repository
        if: ${{ steps.deploy-key-ready.outputs.ready == 'true' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pages-repo/${TARGET_DIR}"
          rsync -a --delete \
            "${RUNNER_TEMP}/web-build/" \
            "${RUNNER_TEMP}/pages-repo/${TARGET_DIR}/"

      - name: Commit deployment if needed
        if: ${{ steps.deploy-key-ready.outputs.ready == 'true' }}
        working-directory: ${{ runner.temp }}/pages-repo
        run: |
          if [ -z "$(git status --short -- "${TARGET_DIR}")" ]; then
            echo "No web changes to deploy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${TARGET_DIR}"
          git commit -m "Deploy lyric web from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin "$TARGET_BRANCH"
