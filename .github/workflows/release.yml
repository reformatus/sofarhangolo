name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: true
        type: string
      deploy_prerelease:
        description: Deploy web even for prerelease
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      release_date: ${{ steps.meta.outputs.release_date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          git rev-parse "refs/tags/${release_tag}" >/dev/null
          release_ref="refs/tags/${release_tag}"

          version_line="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          build_name="${version_line%%+*}"
          build_number="${version_line##*+}"
          release_date="$(date -u +%F)"

          prerelease=false
          if [[ "${release_tag%%+*}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "release_tag=$release_tag"
            echo "release_ref=$release_ref"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "release_date=$release_date"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes "" --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${args[@]}"

  verify:
    name: Verify release build
    runs-on: ubuntu-latest
    needs: release-context
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.release_ref }}

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test test

  trigger-codemagic:
    name: Trigger Codemagic mobile build
    runs-on: ubuntu-latest
    needs: [release-context, verify]
    if: ${{ needs.release-context.result == 'success' && needs.verify.result == 'success' }}
    steps:
      - name: Start Codemagic build via REST API
        shell: bash
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ vars.CODEMAGIC_APP_ID }}
          CODEMAGIC_WORKFLOW_ID: ${{ vars.CODEMAGIC_MOBILE_WORKFLOW_ID }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -z "${CODEMAGIC_API_TOKEN:-}" ]]; then
            echo "CODEMAGIC_API_TOKEN secret is not set – skipping Codemagic trigger."
            exit 0
          fi
          if [[ -z "${CODEMAGIC_APP_ID:-}" || -z "${CODEMAGIC_WORKFLOW_ID:-}" ]]; then
            echo "CODEMAGIC_APP_ID or CODEMAGIC_MOBILE_WORKFLOW_ID variable is not set – skipping Codemagic trigger."
            exit 0
          fi

          echo "Triggering Codemagic build for tag: ${RELEASE_TAG}"
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            -d "$(jq -n \
              --arg appId      "${CODEMAGIC_APP_ID}" \
              --arg workflowId "${CODEMAGIC_WORKFLOW_ID}" \
              --arg tag        "${RELEASE_TAG}" \
              '{ appId: $appId, workflowId: $workflowId, tag: $tag }')" \
            https://api.codemagic.io/builds)"

          http_code="$(echo "${response}" | tail -n 1)"
          body="$(echo "${response}" | sed '$d')"

          if [[ "${http_code}" != "200" ]]; then
            echo "Codemagic API returned HTTP ${http_code}: ${body}" >&2
            exit 1
          fi

          build_id="$(echo "${body}" | jq -r '.buildId // empty')"
          if [[ -n "${build_id}" ]]; then
            echo "Codemagic build started: https://codemagic.io/app/${CODEMAGIC_APP_ID}/build/${build_id}"
          fi

  build-linux:
    name: Build Linux Flatpak
    needs: [release-context, verify]
    uses: ./.github/workflows/release-linux.yml
    with:
      release_tag: ${{ needs.release-context.outputs.release_tag }}
      release_ref: ${{ needs.release-context.outputs.release_ref }}
      build_name: ${{ needs.release-context.outputs.build_name }}
      build_number: ${{ needs.release-context.outputs.build_number }}
      release_date: ${{ needs.release-context.outputs.release_date }}
      prerelease: ${{ needs.release-context.outputs.prerelease }}
    secrets: inherit

  build-windows:
    name: Build Windows installer and Store package
    needs: [release-context, verify]
    uses: ./.github/workflows/release-windows.yml
    with:
      release_tag: ${{ needs.release-context.outputs.release_tag }}
      release_ref: ${{ needs.release-context.outputs.release_ref }}
      build_name: ${{ needs.release-context.outputs.build_name }}
      build_number: ${{ needs.release-context.outputs.build_number }}
      release_date: ${{ needs.release-context.outputs.release_date }}
      prerelease: ${{ needs.release-context.outputs.prerelease }}
    secrets: inherit

  build-macos:
    name: Build macOS DMG and App Store package
    needs: [release-context, verify]
    uses: ./.github/workflows/release-macos.yml
    with:
      release_tag: ${{ needs.release-context.outputs.release_tag }}
      release_ref: ${{ needs.release-context.outputs.release_ref }}
      build_name: ${{ needs.release-context.outputs.build_name }}
      build_number: ${{ needs.release-context.outputs.build_number }}
      release_date: ${{ needs.release-context.outputs.release_date }}
      prerelease: ${{ needs.release-context.outputs.prerelease }}
    secrets: inherit

  build-web:
    name: Build and deploy web
    needs: [release-context, verify]
    uses: ./.github/workflows/release-web.yml
    with:
      release_tag: ${{ needs.release-context.outputs.release_tag }}
      release_ref: ${{ needs.release-context.outputs.release_ref }}
      build_name: ${{ needs.release-context.outputs.build_name }}
      build_number: ${{ needs.release-context.outputs.build_number }}
      release_date: ${{ needs.release-context.outputs.release_date }}
      prerelease: ${{ needs.release-context.outputs.prerelease }}
      deploy_prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_prerelease || false }}
    secrets: inherit

  upload-release-assets:
    name: Upload assets to GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [release-context, build-linux, build-windows, build-macos]
    if: ${{ !cancelled() && needs.release-context.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.build-linux.result == 'success' }}
        with:
          name: linux-release-assets
          path: dist/linux

      - uses: actions/download-artifact@v4
        if: ${{ needs.build-windows.result == 'success' }}
        with:
          name: windows-release-assets
          path: dist/windows

      - uses: actions/download-artifact@v4
        if: ${{ needs.build-macos.result == 'success' }}
        with:
          name: macos-release-assets
          path: dist/macos

      - uses: actions/download-artifact@v4
        if: ${{ needs.build-macos.result == 'success' && needs.build-macos.outputs.app_store_ready == 'true' }}
        with:
          name: macos-app-store-package
          path: dist/macos-app-store

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f | sort)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets were produced." >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

