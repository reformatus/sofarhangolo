name: Release Mobile Assets

on:
  repository_dispatch:
    types: [codemagic-build-complete]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to attach mobile artifacts to
        required: true
        type: string
      apk_url:
        description: (Optional) Codemagic artifact URL for APK
        required: false
        type: string
      ipa_url:
        description: (Optional) Codemagic artifact URL for IPA
        required: false
        type: string

concurrency:
  group: release-mobile-${{ github.event.client_payload.tag || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  attach-mobile-assets:
    name: Attach mobile assets to GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
    steps:
      - name: Resolve release context
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            release_tag="${{ github.event.client_payload.tag }}"
            apk_url="${{ github.event.client_payload.apk_url }}"
            ipa_url="${{ github.event.client_payload.ipa_url }}"
          else
            release_tag="${{ inputs.release_tag }}"
            apk_url="${{ inputs.apk_url || '' }}"
            ipa_url="${{ inputs.ipa_url || '' }}"
          fi

          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" --jq '.object.sha')"

          {
            echo "release_tag=$release_tag"
            echo "release_sha=$release_sha"
            echo "apk_url=$apk_url"
            echo "ipa_url=$ipa_url"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$(( $(date +%s) + 300 ))
          while [[ $(date +%s) -lt $deadline ]]; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG found."
              exit 0
            fi
            echo "Waiting for release $RELEASE_TAG to be created..."
            sleep 10
          done
          echo "Release $RELEASE_TAG not found after waiting." >&2
          exit 1

      - name: Download mobile artifacts
        if: ${{ steps.meta.outputs.apk_url != '' || steps.meta.outputs.ipa_url != '' }}
        shell: bash
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
        run: |
          mkdir -p dist/mobile

          apk_url="${{ steps.meta.outputs.apk_url }}"
          ipa_url="${{ steps.meta.outputs.ipa_url }}"

          if [[ -z "${CODEMAGIC_API_TOKEN:-}" ]]; then
            echo "CODEMAGIC_API_TOKEN is not set – cannot download Codemagic artifacts." >&2
            exit 1
          fi

          if [[ -n "$apk_url" ]]; then
            echo "Downloading APK..."
            curl -fsSL -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
              -o "dist/mobile/sofar-hangolo-${{ steps.meta.outputs.release_tag }}.apk" \
              "$apk_url"
          fi

          if [[ -n "$ipa_url" ]]; then
            echo "Downloading IPA..."
            curl -fsSL -H "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
              -o "dist/mobile/sofar-hangolo-${{ steps.meta.outputs.release_tag }}.ipa" \
              "$ipa_url"
          fi

      - name: Upload mobile artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find dist/mobile -type f 2>/dev/null | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No mobile assets to upload."
            exit 0
          fi

          echo "Uploading ${#files[@]} mobile asset(s)..."
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  trigger-product-page-downloads:
    name: Trigger product page downloads update
    runs-on: ubuntu-latest
    permissions:
      actions: write
    needs: [attach-mobile-assets]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'repository_dispatch' &&
        needs.attach-mobile-assets.result == 'success'
      }}
    steps:
      - name: Wait for main release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.attach-mobile-assets.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.attach-mobile-assets.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$(( $(date +%s) + 1800 ))
          run_ok=false

          while [[ $(date +%s) -lt $deadline ]]; do
            release_runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Release" \
              --json databaseId,headBranch,headSha,status,conclusion \
              --limit 20)"

            match="$(jq -r --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" '.[] | select(.headBranch == $tag or .headSha == $sha) | @base64' <<<"$release_runs" | head -n 1)"
            if [[ -z "$match" ]]; then
              sleep 20
              continue
            fi

            status="$(printf '%s' "$match" | base64 --decode | jq -r '.status')"
            conclusion="$(printf '%s' "$match" | base64 --decode | jq -r '.conclusion')"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              run_ok=true
              break
            fi
            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "Main release workflow completed with conclusion: $conclusion"
              exit 1
            fi

            sleep 20
          done

          if [[ "$run_ok" != "true" ]]; then
            echo "Timed out waiting for main release workflow for tag ${RELEASE_TAG}."
            exit 1
          fi

      - name: Trigger product page downloads workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-product-page-downloads.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

